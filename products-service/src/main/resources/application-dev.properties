# ============================================
# DATABASE CONFIGURATION - DEVELOPMENT
# ============================================

# PostgreSQL Development
spring.datasource.url=jdbc:postgresql://localhost:5432/easydora
spring.datasource.username=admin
spring.datasource.password=${DB_PASSWORD:local_dev_placeholder}

# JPA Development Settings

#DEV
#spring.jpa.hibernate.ddl-auto=create-drop
#spring.jpa.hibernate.ddl-auto=validate
#spring.jpa.hibernate.ddl-auto=none

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=products_schema
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.web.cors.allow-credentials=false
# ============================================
# MESSAGE BROKER CONFIGURATION - DEVELOPMENT
# ============================================

# RabbitMQ Development
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=${RABBITMQ_PASSWORD:local_dev_placeholder}

spring.rabbitmq.listener.simple.default-verify-container=false
spring.rabbitmq.listener.direct.default-verify-container=false

# ============================================
# LOGGING CONFIGURATION - DEVELOPMENT
# ============================================

# Logging Levels for Development
logging.level.com.easydora.products=DEBUG
logging.level.org.springframework=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.transaction=DEBUG

logging.level.org.springframework.security=TRACE
logging.level.org.springframework.web=TRACE
logging.level.org.springframework.web.filter=TRACE

# ============================================
# APPLICATION SPECIFIC - DEVELOPMENT
# ============================================

# Habilita endpoints de debug
management.endpoints.web.exposure.include=health,info,metrics,beans
management.endpoint.health.show-details=always

# ============================================
# FLYWAY CONFIGURATION - DEVELOPMENT
# ============================================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=products_schema
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=false

logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.jdbc=DEBUG