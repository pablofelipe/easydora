# Configuração do servidor
server.port=8082
spring.application.name=products-service

# Profile ativo (default para desenvolvimento)
spring.profiles.active=dev

# Configurações comuns do JPA
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=products_schema

# Configurações comuns do RabbitMQ (se necessário para outros eventos)
spring.rabbitmq.connection-timeout=5s
