services:
  # Banco de Dados
  postgres:
    image: postgres:15-alpine
    restart: on-failure
    environment:
      POSTGRES_DB: easydora
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d easydora"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - easydora-network

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: on-failure
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    # rabbitmq_prometheus ships built into the image since RabbitMQ 3.8; it
    # just isn't enabled by default. Mounting a custom enabled_plugins file
    # (rather than running `rabbitmq-plugins enable` as a separate command
    # before the entrypoint) avoids that command touching
    # /var/lib/rabbitmq/.erlang.cookie before the image's own entrypoint
    # has set up permissions on it -- see
    # docs/adr/0036-metrics-via-prometheus-grafana.md.
    volumes:
      - ./observability/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15692:15692"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - easydora-network

  # Prometheus: scrapes every service's native /metrics or
  # /actuator/prometheus endpoint, plus RabbitMQ's own Prometheus plugin
  # above. No exporter processes, no OpenTelemetry collector -- see
  # docs/adr/0036-metrics-via-prometheus-grafana.md.
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: on-failure
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - easydora-network

  # Grafana: datasource and dashboards both auto-provisioned from versioned
  # files (observability/grafana/provisioning) -- no manual UI setup step.
  grafana:
    image: grafana/grafana-oss:11.3.0
    restart: on-failure
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      - ./observability/grafana/dashboards:/etc/grafana/provisioning/dashboards/json
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - easydora-network

  # Jaeger: distributed tracing backend, OTLP receiver built in (4317
  # gRPC / 4318 HTTP) -- see docs/adr/0024-distributed-tracing-via-propagated-identifiers.md's
  # 2026-08-02 Update. All-in-one image bundles the collector, storage
  # (in-memory, not persisted across restarts) and query UI in one
  # container -- adequate for this project's traffic volume, same
  # reasoning ADR-0024 already applies to not adopting sampling.
  jaeger:
    image: jaegertracing/all-in-one:1.65.0
    restart: on-failure
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # Query UI
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
    networks:
      - easydora-network

  # API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8081
      - PRODUCTS_SERVICE_URL=http://products-service:8082
      - INVENTORY_SERVICE_URL=http://inventory-service:8083
      - ORDERS_SERVICE_URL=http://orders-service:8084
      - BILLING_SERVICE_URL=http://billing-service:8085
      - NOTIFICATION_SERVICE_URL=http://notification-service:8086
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_SERVICE_NAME=api-gateway
    depends_on:
      - auth-service
      - products-service
      - orders-service
      - inventory-service
      - billing-service
      - notification-service
      - jaeger
    networks:
      - easydora-network

  # Auth Service
  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: auth-service
    restart: on-failure
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/easydora
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - APP_JWT_SECRET=${APP_JWT_SECRET}
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=admin
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - MANAGEMENT_OTLP_TRACING_ENDPOINT=http://jaeger:4318/v1/traces
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      jaeger:
        condition: service_started
    networks:
      - easydora-network

  # Products Service
  products-service:
    build:
      context: .
      dockerfile: products-service/Dockerfile
    container_name: products-service
    restart: on-failure
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/easydora
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=admin
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - MANAGEMENT_OTLP_TRACING_ENDPOINT=http://jaeger:4318/v1/traces
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      jaeger:
        condition: service_started
    networks:
      - easydora-network

  # Orders Service
  orders-service:
    build:
      context: .
      dockerfile: orders-service/Dockerfile
    container_name: orders-service
    restart: on-failure
    ports:
      - "8084:8084"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/easydora
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=admin
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - MANAGEMENT_OTLP_TRACING_ENDPOINT=http://jaeger:4318/v1/traces
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      jaeger:
        condition: service_started
    networks:
      - easydora-network

  # Inventory Service
  inventory-service:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    container_name: inventory-service
    restart: on-failure
    ports:
      - "8083:8083"
    environment:
      - DATABASE_URL=postgresql://admin:${DB_PASSWORD}@postgres:5432/easydora
      - RABBITMQ_URL=amqp://admin:${RABBITMQ_PASSWORD}@rabbitmq:5672
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=admin
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=easydora
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=admin
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_SERVICE_NAME=inventory-service
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      jaeger:
        condition: service_started
    networks:
      - easydora-network

  # Billing Service
  billing-service:
    build:
      context: .
      dockerfile: billing-service/Dockerfile
    container_name: billing-service
    restart: on-failure
    ports:
      - "8085:8085"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/easydora
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=admin
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - MANAGEMENT_OTLP_TRACING_ENDPOINT=http://jaeger:4318/v1/traces
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      jaeger:
        condition: service_started
    networks:
      - easydora-network

  # Notification Service
  notification-service:
    build: ./notification-service
    container_name: notification-service
    restart: on-failure
    ports:
      - "8086:8086"
    environment:
      - RABBITMQ_URL=amqp://admin:${RABBITMQ_PASSWORD}@rabbitmq:5672
      - AUTH_SERVICE_URL=http://auth-service:8081
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=easydora
      - DB_USER=admin
      - DB_PASSWORD=${DB_PASSWORD}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_SERVICE_NAME=notification-service
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth-service:
        condition: service_started
      jaeger:
        condition: service_started
    networks:
      - easydora-network

  # Frontend
  # VITE_GATEWAY_URL is a build-time value baked into the client bundle by
  # Vite (see frontend/src/lib/api/client.ts) -- it must be an address the
  # user's browser can reach, not a Docker-network hostname, so it points
  # at the Gateway's host-published port, same as if the frontend were run
  # locally with `npm run dev`.
  frontend:
    build:
      context: ./frontend
      args:
        - VITE_GATEWAY_URL=http://localhost:8080
    restart: on-failure
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway
    networks:
      - easydora-network

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  easydora-network:
    driver: bridge