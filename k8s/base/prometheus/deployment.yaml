# No PersistentVolumeClaim -- losing metric history on a pod restart is not
# a requirement for this demo environment (see docs/adr/0040). Config comes
# from the exact same observability/prometheus/prometheus.yml the project
# already versions, generated into a ConfigMap by kustomization.yaml --
# unmodified, because every scrape target hostname already matches the
# Kubernetes Service name used in this same delivery.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: easydora
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 10
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config
