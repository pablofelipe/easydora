apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-service
  namespace: easydora
  labels:
    app: billing-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: billing-service
  template:
    metadata:
      labels:
        app: billing-service
    spec:
      containers:
        - name: billing-service
          image: easydora-billing-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8085
          envFrom:
            - configMapRef:
                name: billing-service-config
          env:
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: easydora-secrets
                  key: DB_PASSWORD
            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: easydora-secrets
                  key: RABBITMQ_PASSWORD
          readinessProbe:
            httpGet:
              path: /billing/health
              port: 8085
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            # Actuator's liveness group, backed by rabbitMqProgress
            # (docs/adr/0038's Update) -- see orders-service's identical
            # setup for the full rationale.
            httpGet:
              path: /billing/actuator/health/liveness
              port: 8085
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 3
