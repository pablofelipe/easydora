apiVersion: apps/v1
kind: Deployment
metadata:
  name: products-service
  namespace: easydora
  labels:
    app: products-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: products-service
  template:
    metadata:
      labels:
        app: products-service
    spec:
      containers:
        - name: products-service
          image: easydora-products-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: products-service-config
          env:
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: easydora-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: easydora-secrets
                  key: JWT_SECRET
            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: easydora-secrets
                  key: RABBITMQ_PASSWORD
          readinessProbe:
            httpGet:
              path: /products/health
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            # Actuator's liveness group, backed by rabbitMqProgress
            # (docs/adr/0038's Update) -- see orders-service's identical
            # setup for the full rationale.
            httpGet:
              path: /products/actuator/health/liveness
              port: 8082
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 3
