apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: easydora
  labels:
    app: inventory-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
        - name: inventory-service
          image: easydora-inventory-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: inventory-service-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: easydora-secrets
                  key: DB_PASSWORD
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: easydora-secrets
                  key: RABBITMQ_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            # Backed by ProgressWatchdog (docs/adr/0038's Update) -- reports
            # DOWN only when the messaging loop is genuinely stalled, never
            # merely because RabbitMQ is unreachable. Separate from the
            # readinessProbe's plain /health above.
            httpGet:
              path: /health/liveness
              port: 8083
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
