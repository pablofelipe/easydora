# NodePort 30081 -> host 3000 via kind-config.yaml's extraPortMappings,
# matching docker-compose's own frontend:3000 publish.
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: easydora
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30081
