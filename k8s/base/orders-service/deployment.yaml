apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-service
  namespace: easydora
  labels:
    app: orders-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders-service
  template:
    metadata:
      labels:
        app: orders-service
    spec:
      containers:
        - name: orders-service
          image: easydora-orders-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8084
          envFrom:
            - configMapRef:
                name: orders-service-config
          env:
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: easydora-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: easydora-secrets
                  key: JWT_SECRET
            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: easydora-secrets
                  key: RABBITMQ_PASSWORD
          readinessProbe:
            httpGet:
              path: /orders/health
              port: 8084
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            # Actuator's liveness group (application.properties), not the
            # plain /orders/health readiness check above -- this one is
            # backed by rabbitMqProgress (docs/adr/0038's Update), which
            # only reports DOWN when the messaging loop is genuinely
            # stalled, never merely because RabbitMQ is unreachable.
            httpGet:
              path: /orders/actuator/health/liveness
              port: 8084
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 3
