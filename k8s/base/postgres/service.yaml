# Named "postgres" -- the exact hostname every Spring/Go service's
# datasource env vars already use in docker-compose.yml. Keeping the same
# name here is what makes the application-level connection code require
# zero changes (see docs/adr/0040).
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: easydora
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
