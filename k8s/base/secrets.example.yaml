# Copy to secrets.yaml, fill in real values, and apply with:
#   kubectl apply -f k8s/base/secrets.yaml
# secrets.yaml is gitignored -- never commit it. Mirrors the same convention
# already used for the root .env/.env.example (see docs/adr/0040).
#
# stringData accepts plain values (kubectl base64-encodes them on apply) --
# no manual encoding step needed when editing this file.
apiVersion: v1
kind: Secret
metadata:
  name: easydora-secrets
  namespace: easydora
type: Opaque
stringData:
  DB_PASSWORD: changeme
  RABBITMQ_PASSWORD: changeme
  APP_JWT_SECRET: changeme
  ADMIN_EMAIL: changeme
  ADMIN_PASSWORD: changeme
  GRAFANA_ADMIN_PASSWORD: changeme
  # Full DSNs some services read directly instead of discrete host/port/user
  # vars (see docker-compose.yml's own RABBITMQ_URL for notification-service).
  # Kubernetes Secret manifests can't interpolate one field into another the
  # way docker-compose.yml's ${RABBITMQ_PASSWORD} substitution does, so the
  # password appears twice in this file -- once alone, once inline here.
  # Keep both in sync manually when rotating the password.
  RABBITMQ_URL: amqp://admin:changeme@rabbitmq:5672
