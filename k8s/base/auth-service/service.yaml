# Named "auth-service" -- the exact hostname api-gateway's/notification-service's
# own AUTH_SERVICE_URL already uses in docker-compose.yml (see docs/adr/0040).
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: easydora
spec:
  selector:
    app: auth-service
  ports:
    - port: 8081
      targetPort: 8081
