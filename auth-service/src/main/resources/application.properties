# Configuração do servidor
server.port=8081
# The Gateway forwards the incoming path unchanged (ADR-0025): this service
# is self-namespaced under its own routing segment so direct calls and
# calls proxied through the Gateway hit the exact same path.
server.servlet.context-path=/auth
spring.application.name=auth-service

# Profile ativo (default para produção/docker)
spring.profiles.active=prod

# Configurações comuns
spring.jpa.properties.hibernate.default_schema=auth_schema
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Secret
jwt.secret=${JWT_SECRET:default-secret-key}

# Structured (logfmt-style key=value) console logging: same field set and
# order across all four Spring services, see docs/architecture/observability.md.
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} service=auth-service level=%-5level correlationId=%X{correlationId:-} requestId=%X{requestId:-} messageId=%X{messageId:-} logger=%logger{36} - %msg%n

# Histogram buckets for http_server_requests_seconds, needed for
# histogram_quantile-based latency panels (see ADR-0036).
management.metrics.distribution.percentiles-histogram.http.server.requests=true

spring.profiles.active=dev