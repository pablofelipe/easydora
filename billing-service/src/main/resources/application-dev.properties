spring.datasource.url=jdbc:postgresql://localhost:5432/easydora
spring.datasource.username=admin
spring.datasource.password=${DB_PASSWORD:local_dev_placeholder}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=${RABBITMQ_PASSWORD:local_dev_placeholder}

logging.level.org.springframework=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=billing_schema
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=false

logging.level.org.flywaydb=DEBUG
