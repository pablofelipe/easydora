server.port=8085
spring.application.name=billing-service

# Profile ativo (default para desenvolvimento)
spring.profiles.active=dev

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=billing_schema

spring.rabbitmq.connection-timeout=5s
rabbitmq.queue.order-created=billing.order.created.queue

# Message consumption resilience: limited retry with exponential
# backoff before the messageRecoverer bean (RabbitMQConfig) republishes to
# the dead letter exchange/queue. Native Spring Boot listener retry, no
# custom retry code.
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=200
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.retry.max-interval=2000

# Structured (logfmt-style key=value) console logging: same field set and
# order across all four Spring services, see docs/architecture/observability.md.
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} service=billing-service level=%-5level correlationId=%X{correlationId:-} requestId=%X{requestId:-} messageId=%X{messageId:-} logger=%logger{36} - %msg%n
