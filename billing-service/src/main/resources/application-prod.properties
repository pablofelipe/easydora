# ============================================
# DATABASE CONFIGURATION - PRODUCTION
# ============================================

# PostgreSQL Production (Environment Variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/easydora}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# JPA Production Settings
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ============================================
# MESSAGE BROKER CONFIGURATION - PRODUCTION
# ============================================

# RabbitMQ Production
spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# ============================================
# LOGGING CONFIGURATION - PRODUCTION
# ============================================

# Logging Levels for Production
logging.level.com.easydora.billing=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN

# Logging Pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n

# ============================================
# APPLICATION SPECIFIC - PRODUCTION
# ============================================

# Security and Management
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never

# Server Settings
server.tomcat.max-threads=200
server.tomcat.min-spare-threads=20

# Connection Pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
