# Auto-loads every JSON file in observability/grafana/dashboards on Grafana
# startup -- dashboards are versioned files, not manual UI configuration
# (see docs/adr/0036-metrics-via-prometheus-grafana.md).
apiVersion: 1

providers:
  - name: easydora
    orgId: 1
    folder: EasyDora
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards/json
