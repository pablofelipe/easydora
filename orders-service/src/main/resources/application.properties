# Configuração do servidor
server.port=8084
# The Gateway forwards the incoming path unchanged (ADR-0025): this service
# is self-namespaced under its own routing segment so direct calls and
# calls proxied through the Gateway hit the exact same path.
server.servlet.context-path=/orders
spring.application.name=orders-service

# Profile ativo (default para desenvolvimento)
spring.profiles.active=dev

# Configurações comuns do JPA
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=orders_schema

# Boot-time Postgres readiness (ADR-0038): HikariCP's default
# initialization-fail-timeout (1ms) fails immediately on the first
# connection attempt, no retry -- confirmed empirically to crash this
# service (exit code 1, ~2s) if Postgres isn't yet accepting connections
# despite already passing docker-compose's own healthcheck. Raising this
# lets HikariCP's own internal retry silently absorb the same race
# instead of crashing on the first attempt -- confirmed empirically too:
# with Postgres down at boot and brought up ~6s later, the pool blocked
# quietly (no per-attempt log line -- a real, accepted trade-off against
# inventory-service's/notification-service's explicit "attempt N/M"
# logging) and connected the moment Postgres became reachable.
spring.datasource.hikari.initialization-fail-timeout=30000

# Configurações comuns do RabbitMQ (se necessário para outros eventos)
spring.rabbitmq.connection-timeout=5s

# Message consumption resilience: limited retry with exponential
# backoff before the messageRecoverer bean (RabbitMQConfig) republishes to
# the dead letter exchange/queue. Native Spring Boot listener retry, no
# custom retry code.
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=200
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.retry.max-interval=2000

# JWT Secret
jwt.secret=${JWT_SECRET:default-secret-key}

# Structured (logfmt-style key=value) console logging: same field set and
# order across all four Spring services, see docs/architecture/observability.md.
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} service=orders-service level=%-5level correlationId=%X{correlationId:-} requestId=%X{requestId:-} messageId=%X{messageId:-} traceId=%X{traceId:-} spanId=%X{spanId:-} logger=%logger{36} - %msg%n

# Distributed tracing export (docs/adr/0024-distributed-tracing-via-propagated-identifiers.md's
# 2026-08-02 Update). See auth-service's application.properties for the
# full rationale.
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

# Histogram buckets for http_server_requests_seconds, needed for
# histogram_quantile-based latency panels (see ADR-0036).
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Kubernetes liveness/readiness probe groups (docs/adr/0038's Update):
# rabbitMqProgress joins the liveness group specifically, not the default
# aggregate health -- it answers "is this process's messaging loop stalled",
# never "is RabbitMQ reachable right now". Conflating the two would make the
# k8s livenessProbe restart every consumer during an ordinary, tolerated
# broker outage, turning an external dependency's downtime into a
# self-inflicted restart storm.
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState,rabbitMqProgress
